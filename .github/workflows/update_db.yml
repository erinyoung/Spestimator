name: Update RefSeq 16S Database

on:
  schedule:
    # Quarterly: 1st day of Jan, Apr, Jul, Oct at 00:00 UTC
    - cron: '0 0 1 */3 *'
  workflow_dispatch:

jobs:
  update-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current RefSeq Release Number
        id: refseq_version
        run: |
          RELEASE_NUM=$(curl -s https://ftp.ncbi.nlm.nih.gov/refseq/release/RELEASE_NUMBER | tr -d '\n')
          echo "REFSEQ_RELEASE=$RELEASE_NUM" >> $GITHUB_ENV
          echo "Current RefSeq Release: $RELEASE_NUM"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Install BLAST+
        run: sudo apt-get update && sudo apt-get install -y ncbi-blast+

      - name: Update Spestimator Database
        run: |
          spestimator \
            --update-db \
            --db-dir src/spestimator/data \
            --api-key ${{ secrets.NCBI_API_KEY }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create branch and commit
        # Using the ENV variable fetched earlier
        run: |
          BRANCH_NAME="spestimator-update-${{ env.REFSEQ_RELEASE }}-$(date +%Y%m%d)"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          
          git checkout -b $BRANCH_NAME
          
          # Add the specific generated files (ensure path matches your makeblastdb output)
          # Note: The wildcard matches bacteria.16SrRNA.nsq, .nin, .nhr etc.
          git add src/spestimator/data/bacteria.16SrRNA* src/spestimator/data/metadata.csv.gz
          
          git commit -m "Update 16S BLAST DB (RefSeq Release ${{ env.REFSEQ_RELEASE }})" || echo "No changes to commit"

      - name: Push branch
        uses: ad-m/github-push-action@v0.6.0
        with:
          branch: ${{ env.BRANCH_NAME }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.BRANCH_NAME }}
          title: "Update 16S BLAST DB (RefSeq Release ${{ env.REFSEQ_RELEASE }})"
          body: |
            This PR updates the internal 16S BLAST database and metadata.
            
            **RefSeq Release:** ${{ env.REFSEQ_RELEASE }}
            **Date:** $(date +%Y-%m-%d)
            
            _Generated automatically by Spestimator GitHub Action._
