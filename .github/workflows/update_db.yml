name: Update RefSeq 16S Database

on:
  schedule:
    # Quarterly: 1st day of Jan, Apr, Jul, Oct at 00:00 UTC
    - cron: '0 0 1 */3 *'
  workflow_dispatch:

jobs:
  update-db:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get RefSeq Version & Date
        id: meta
        run: |
          RELEASE_NUM=$(curl -s https://ftp.ncbi.nlm.nih.gov/refseq/release/RELEASE_NUMBER | tr -d '\n')
          CURRENT_DATE=$(date +%Y-%m-%d)
          
          echo "REFSEQ_RELEASE=$RELEASE_NUM" >> $GITHUB_ENV
          echo "DATE=$CURRENT_DATE" >> $GITHUB_ENV
          
          echo "Current RefSeq Release: $RELEASE_NUM"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Install BLAST+
        run: sudo apt-get update && sudo apt-get install -y ncbi-blast+

      - name: Update Spestimator Database
        run: |
          spestimator \
            --update-db \
            --db-dir src/spestimator/data \
            --api-key ${{ secrets.NCBI_API_KEY }}

      - name: Bump Version Suffix
        run: |
          sed -i 's/version = "\([0-9]\+\.[0-9]\+\.[0-9]\+\)\(\.[0-9]\+\)\?"/version = "\1.${{ env.REFSEQ_RELEASE }}"/' pyproject.toml
          echo "Bumped version to .${{ env.REFSEQ_RELEASE }}"
          grep "version =" pyproject.toml

      # NEW: Manually force-add the ignored files so the PR action sees them
      - name: Stage ignored DB files
        run: |
          git add -f src/spestimator/data/bacteria.16SrRNA*
          git add src/spestimator/data/metadata.csv.gz
          git add pyproject.toml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          # We use the date variable we created in step 2
          branch: "spestimator-update-${{ env.REFSEQ_RELEASE }}-${{ env.DATE }}"
          commit-message: "Update 16S DB (RefSeq ${{ env.REFSEQ_RELEASE }}) & Bump Version"
          title: "Update 16S DB (RefSeq Release ${{ env.REFSEQ_RELEASE }})"
          # No need for 'add-paths' because we staged them manually above
          body: |
            Updates the internal BLAST DB and metadata to RefSeq Release **${{ env.REFSEQ_RELEASE }}**.
            
            This PR also updates `pyproject.toml` to append the RefSeq build metadata.
            
            **Date:** ${{ env.DATE }}
            _Generated automatically by Spestimator GitHub Action._
