name: Update RefSeq 16S Database

on:
  schedule:
    # Quarterly: 1st day of Jan, Apr, Jul, Oct at 00:00 UTC
    - cron: '0 0 1 */3 *'
  workflow_dispatch:

jobs:
  update-db:
    runs-on: ubuntu-latest
    
    # Permissions required to push changes and create PRs
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current RefSeq Release Number
        id: refseq_version
        run: |
          RELEASE_NUM=$(curl -s https://ftp.ncbi.nlm.nih.gov/refseq/release/RELEASE_NUMBER | tr -d '\n')
          echo "REFSEQ_RELEASE=$RELEASE_NUM" >> $GITHUB_ENV
          echo "Current RefSeq Release: $RELEASE_NUM"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Install BLAST+
        run: sudo apt-get update && sudo apt-get install -y ncbi-blast+

      - name: Update Spestimator Database
        run: |
          spestimator \
            --update-db \
            --db-dir src/spestimator/data \
            --api-key ${{ secrets.NCBI_API_KEY }}

      - name: Bump Version Suffix
        run: |
          # Option 1: Dot Notation (0.1.0.232)
          # Replaces 'version = "0.1.0"' (or "0.1.0.230") with 'version = "0.1.0.232"'
          
          # 1. Look for version = "X.Y.Z" optionally followed by ".something"
          # 2. Capture X.Y.Z
          # 3. Append .${REFSEQ_RELEASE}
          
          sed -i 's/version = "\([0-9]\+\.[0-9]\+\.[0-9]\+\)\(\.[0-9]\+\)\?"/version = "\1.${{ env.REFSEQ_RELEASE }}"/' pyproject.toml
          
          echo "Bumped version to .${{ env.REFSEQ_RELEASE }}"
          grep "version =" pyproject.toml

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create branch and commit
        run: |
          BRANCH_NAME="spestimator-update-${{ env.REFSEQ_RELEASE }}-$(date +%Y%m%d)"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          
          git checkout -b $BRANCH_NAME
          
          # Add DB files, metadata, AND the updated pyproject.toml
          git add -f src/spestimator/data/bacteria.16SrRNA* src/spestimator/data/metadata.csv.gz pyproject.toml
          
          git commit -m "Update 16S DB (RefSeq ${{ env.REFSEQ_RELEASE }}) & Bump Version" || echo "No changes to commit"

      - name: Push branch
        uses: ad-m/github-push-action@v0.6.0
        with:
          branch: ${{ env.BRANCH_NAME }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.BRANCH_NAME }}
          title: "Update 16S DB (RefSeq Release ${{ env.REFSEQ_RELEASE }})"
          body: |
            Updates the internal BLAST DB and metadata to RefSeq Release **${{ env.REFSEQ_RELEASE }}**.
            
            This PR also updates `pyproject.toml` to append the RefSeq build metadata (e.g., `+rs${{ env.REFSEQ_RELEASE }}`).
            
            **Date:** $(date +%Y-%m-%d)
            _Generated automatically by Spestimator GitHub Action._
