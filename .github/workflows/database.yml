name: Test Database Download

on:
  pull_request:
  workflow_dispatch:

jobs:
  update-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Install BLAST+
        run: sudo apt-get update && sudo apt-get install -y ncbi-blast+

      - name: Download Database to Custom Location
        run: |
          spestimator \
            --update-db \
            --db-dir spestimator_db \
            --api-key ${{ secrets.NCBI_API_KEY }}

      - name: Remove Default Database
        run: |
          rm -rf src/spestimator/data

      - name: Use Custom Database Location
        run: |
          spestimator -i tests/sample_positive.fasta 
          head results.csv