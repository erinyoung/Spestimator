name: Generic Test with NCBI Sample

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install NCBI BLAST+
        run: |
          sudo apt-get update
          sudo apt-get install -y ncbi-blast+

      - name: Install Spestimator
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Download sample bacterial genomes
        run: |
          # E. coli
          wget https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/005/845/GCF_000005845.2_ASM584v2/GCF_000005845.2_ASM584v2_genomic.fna.gz
          gunzip GCF_000005845.2_ASM584v2_genomic.fna.gz
          head -n 20 GCF_000005845.2_ASM584v2_genomic.fna
          # K. oxytoca
          wget https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/900/636/985/GCF_900636985.1_45889_C01/GCF_900636985.1_45889_C01_genomic.fna.gz
          gunzip GCF_900636985.1_45889_C01_genomic.fna.gz
          head -n 20 GCF_900636985.1_45889_C01_genomic.fna

      # 6. Run spestimator on the sample
      - name: Run spestimator (basic)
        run: |
          spestimator -i *fna -o testing.csv
          head testing.csv

      # 7. Run spestimator with genome download
      - name: Run spestimator (with genomes)
        run: |
          spestimator -i *.fna -o testing_2.csv --download-genomes genomes
          head testing_2.csv
          ls genomes/* | wc -l
