name: Generic Test

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install NCBI BLAST+
      run: |
        sudo apt-get update
        sudo apt-get install -y ncbi-blast+

    - name: Install DaisyBlast and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Run With Test Files
      run: |
        spestimator -i tests/data/sample.fasta -o testing.csv
        head testing.csv

    - name: Run With Test Files
      run: |
        spestimator -i tests/data/sample.fasta -o testing.csv --download-genomes genomes
        ls genomes/*


    - name: Check Files
      run: |
        ls testing/{blast_hits.txt,divided.bed,final_g
